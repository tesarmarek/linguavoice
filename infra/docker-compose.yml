version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    volumes:
      - linguavoice-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Development service with hot reload
  dev:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: deps
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
    volumes:
      - ..:/app
      - /app/node_modules
      - linguavoice-data:/app/data
    command: npm run dev
    profiles:
      - dev

volumes:
  linguavoice-data:
    driver: local
